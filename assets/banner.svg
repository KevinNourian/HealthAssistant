<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Decorative circles -->
  <circle cx="950" cy="80" r="120" fill="#3b82f6" opacity="0.05" filter="url(#softGlow)" />
  <circle cx="250" cy="320" r="100" fill="#10b981" opacity="0.05" filter="url(#softGlow)" />
  <circle cx="1100" cy="300" r="80" fill="#3b82f6" opacity="0.03" />

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" rx="2" />

  <!-- Heart + Cross icon -->
  <g transform="translate(160, 155)" filter="url(#glow)">
    <!-- Heart shape -->
    <path d="M45 88 C45 88, 5 58, 5 30 C5 12, 18 0, 30 0 C38 0, 45 6, 45 14 C45 6, 52 0, 60 0 C72 0, 85 12, 85 30 C85 58, 45 88, 45 88 Z"
          fill="url(#iconGrad)" opacity="0.9" />
    <!-- Cross overlay -->
    <rect x="36" y="22" width="18" height="44" rx="3" fill="#ffffff" opacity="0.95" />
    <rect x="23" y="35" width="44" height="18" rx="3" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Main title -->
  <text x="280" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Health Assistant
  </text>

  <!-- Subtitle -->
  <text x="280" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#94a3b8" font-weight="400" letter-spacing="0.5">
    AI-Powered Health Knowledge Base with RAG
  </text>

  <!-- Bottom accent line -->
  <rect x="280" y="255" width="80" height="3" fill="url(#accent)" rx="1.5" />

  <!-- Tech badges -->
  <g transform="translate(280, 285)">
    <!-- Streamlit badge -->
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="45" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">Streamlit</text>

    <!-- LangChain badge -->
    <rect x="100" y="0" width="95" height="28" rx="14" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="147" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">LangChain</text>

    <!-- ChromaDB badge -->
    <rect x="205" y="0" width="95" height="28" rx="14" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="252" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">ChromaDB</text>

    <!-- OpenAI badge -->
    <rect x="310" y="0" width="82" height="28" rx="14" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="351" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">OpenAI</text>

    <!-- Python badge -->
    <rect x="402" y="0" width="82" height="28" rx="14" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="443" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">Python</text>
  </g>

  <!-- Right side - Abstract document/node graphic -->
  <g transform="translate(820, 100)" opacity="0.15">
    <!-- Nodes -->
    <circle cx="40" cy="40" r="8" fill="#3b82f6" />
    <circle cx="140" cy="20" r="6" fill="#10b981" />
    <circle cx="120" cy="100" r="7" fill="#3b82f6" />
    <circle cx="200" cy="70" r="5" fill="#10b981" />
    <circle cx="60" cy="140" r="6" fill="#3b82f6" />
    <circle cx="180" cy="150" r="8" fill="#10b981" />
    <circle cx="260" cy="120" r="5" fill="#3b82f6" />
    <circle cx="100" cy="180" r="4" fill="#10b981" />
    <!-- Connections -->
    <line x1="40" y1="40" x2="140" y2="20" stroke="#3b82f6" stroke-width="1" opacity="0.5" />
    <line x1="40" y1="40" x2="120" y2="100" stroke="#3b82f6" stroke-width="1" opacity="0.5" />
    <line x1="140" y1="20" x2="200" y2="70" stroke="#10b981" stroke-width="1" opacity="0.5" />
    <line x1="120" y1="100" x2="200" y2="70" stroke="#10b981" stroke-width="1" opacity="0.5" />
    <line x1="120" y1="100" x2="60" y2="140" stroke="#3b82f6" stroke-width="1" opacity="0.5" />
    <line x1="60" y1="140" x2="180" y2="150" stroke="#10b981" stroke-width="1" opacity="0.5" />
    <line x1="200" y1="70" x2="260" y2="120" stroke="#3b82f6" stroke-width="1" opacity="0.5" />
    <line x1="180" y1="150" x2="260" y2="120" stroke="#10b981" stroke-width="1" opacity="0.5" />
    <line x1="60" y1="140" x2="100" y2="180" stroke="#3b82f6" stroke-width="1" opacity="0.4" />
    <line x1="180" y1="150" x2="100" y2="180" stroke="#10b981" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#accent)" rx="2" />
</svg>
